name: canteen_ordering_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase — major version updates (may require code changes)
  firebase_core: ^4.13.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.10.0

  # UI
  google_fonts: ^6.1.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  google_sign_in: ^7.2.0

  # Utilities
  http: ^1.4.0
  image_picker: ^1.2.1
  share_plus: ^10.0.3
  intl: ^0.20.3
  shared_preferences: ^2.5.4
  cached_network_image: ^3.4.1
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

# For information on the generic Dart part of this file, see:
# https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true

  # ── Assets ──
  assets:
    - assets/icon/

# ─────────────────────────────────────────────────────────────
# Launcher icon configuration
# Generates the home-screen icon for Android, iOS, Web, etc.
# from your single 1024×1024 PNG.
# ─────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/cpc_logo.png"
  min_sdk_android: 21

  # iOS requires no alpha channel on app icons
  remove_alpha_ios: true

  # Optional: adaptive icon for Android 8+ (recommended)
  # Uncomment if you have a separate foreground image:
  # adaptive_icon_background: "#2E7D32"
  # adaptive_icon_foreground: "assets/icon/cpc_logo_foreground.png"

  # Optional: also generate for Web / Windows / macOS
  web:
    generate: true
    image_path: "assets/icon/cpc_logo.png"
    background_color: "#ffffff"
    theme_color: "#2E7D32"

  windows:
    generate: true
    image_path: "assets/icon/cpc_logo.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/cpc_logo.png"